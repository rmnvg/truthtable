services:
  backend:
    build: ./backend
    # Pinned so the image name doesn't depend on the checkout directory name —
    # the test and eval commands in the README refer to it.
    image: truthtable-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    image: truthtable-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/public:/app/public
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
